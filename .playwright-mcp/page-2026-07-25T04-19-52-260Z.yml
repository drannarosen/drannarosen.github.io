      - region [ref=f64e155]:
        - heading "Design record" [level=2] [ref=f64e156]
        - paragraph [ref=f64e157]:
          - text: What is
          - strong [ref=f64e158]: derived
          - text: and what is
          - strong [ref=f64e159]: chosen
          - text: ", kept separate on purpose. Anything in the second column is a judgement that could reasonably be made differently; anything in the first is not up for taste."
        - heading "Derived from physics" [level=3] [ref=f64e160]
        - generic [ref=f64e161]:
          - term [ref=f64e162]: Population
          - definition [ref=f64e163]:
            - text: Masses from a Maschberger IMF, positions from a continuous Plummer profile, Teff and radius per star from its ZAMS state. Same novascope core as the homepage hero. Deterministic in one seed. The half-mass radius used for framing is
            - emphasis [ref=f64e164]: measured from the stars actually drawn
            - text: ", not declared."
          - term [ref=f64e165]: Brightness
          - definition [ref=f64e166]:
            - text: Apparent flux through the chosen filter, with each star at its own distance so the inverse-square law applies
            - emphasis [ref=f64e167]: within
            - text: the cluster. Depth is the star's own z in the cluster frame — never the live camera's axis, because a cluster 400 pc away cannot be orbited, and keying off the camera would make brightness pump as the view rotates.
          - term [ref=f64e168]: Colour
          - definition [ref=f64e169]:
            - text: Blackbody spectrum integrated against the CIE 1931 observer, then rescaled to
            - emphasis [ref=f64e170]: unit luminance
            - text: so the display signal alone sets how bright a star reads. Left peak-normalised, luminance ran 0.49 at 2500 K against 0.90 at 5772 K — a Sun-like star rendered 1.86× more luminous than an O star at the same signal, and measured peak brightness came out non-monotonic in luminosity.
          - term [ref=f64e171]: Point-spread function
          - definition [ref=f64e172]:
            - text: One Moffat profile,
            - strong [ref=f64e173]: the same width for every star
            - text: — a PSF belongs to the atmosphere and optics, not the source. Brightness changes peak intensity only; a bright star looks larger because more of its wing clears the display threshold. Apparent size therefore goes as signal
            - superscript [ref=f64e174]: 1/2β
            - text: .
          - term [ref=f64e175]: Halo and spikes
          - definition [ref=f64e176]:
            - text: Both driven by
            - emphasis [ref=f64e177]: linear
            - text: flux, not the compressed display signal, because scattered light and diffraction are fixed fractions of what entered the aperture and know nothing about display. Spikes are Tier 3 only (~0.5% of stars) and fixed to the instrument, so they do not rotate with the sky.
          - term [ref=f64e178]: Filters
          - definition [ref=f64e179]:
            - text: Rubin ugrizy and Gaia G/BP/RP use
            - strong [ref=f64e180]: real measured curves
            - text: "; Johnson–Cousins and 2MASS are Gaussian models. Gaia G spans ~730 nm, so a Gaussian there is not an approximation but a different filter. Effective wavelengths are derived from the curves and reproduce published values (Rubin r: 622.1 nm vs 622.0)."
        - heading "Chosen, and revisable" [level=3] [ref=f64e181]
        - generic [ref=f64e182]:
          - term [ref=f64e183]: Depth (default 19.8 mag below white)
          - definition [ref=f64e184]:
            - text: An
            - emphasis [ref=f64e185]: exposure
            - text: ", not a fact. At the default, sub-solar stars — 88.5% of the cluster, emitting 0.05% of its V-band light — own ~74% of the summed display signal. That is a ~1500× over-representation, and it is a choice: the alternative hides most of the cluster. A 0.1 M"
            - subscript [ref=f64e186]: ☉
            - text: star here is m
            - subscript [ref=f64e187]: bol
            - text: ≈ 20.3 at 400 pc.
          - term [ref=f64e188]: White percentile (0.995)
          - definition [ref=f64e189]:
            - text: Kept high
            - emphasis [ref=f64e190]: against intuition
            - text: . Lowering it brightens the image but
            - strong [ref=f64e191]: flattens
            - text: "it: max/median signal moves 3.1 → 1.9 as the percentile drops 0.995 → 0.90, because asinh compresses harder at larger argument."
          - term [ref=f64e192]: PSF width 2.2 px, β 3.2, aureole and spike amplitudes
          - definition [ref=f64e193]: Tuned by looking at rendered output. Each has exactly one home in the code and the shader imports it, so they cannot drift apart — but they are taste, not measurement.
          - term [ref=f64e194]: Bloom threshold 1.0
          - definition [ref=f64e195]: Display white, so only genuine HDR overflow glares (~50 of 10,000 stars). Anything lower would bloom the ordinary field and double-count the halo and spikes, which already model why bright stars spread.
          - term [ref=f64e196]: Mass cut
          - definition [ref=f64e197]:
            - text: A
            - emphasis [ref=f64e198]: modelling selection
            - text: ", not an observation. The white point stays calibrated on the full population so the views stay comparable, and the page says so whenever the cut is active."
        - heading "Known limits" [level=3] [ref=f64e199]
        - list [ref=f64e200]:
          - listitem [ref=f64e201]:
            - strong [ref=f64e202]: No absolute zero point.
            - text: Band fluxes are in arbitrary self-consistent units, so colour indices work and apparent AB magnitudes do not. The depth control reads in magnitudes below
            - emphasis [ref=f64e203]: this image's
            - text: white point, which is exact but is not a survey limit.
          - listitem [ref=f64e204]:
            - strong [ref=f64e205]: Blackbody spectra.
            - text: No line blanketing, no Balmer jump, no molecular bands — worst for the cool stars that dominate by number. A real filter curve removes one approximation, not this one.
          - listitem [ref=f64e206]:
            - strong [ref=f64e207]: No gas, no extinction, no binaries, no stellar evolution
            - text: (t = 0 ZAMS throughout).
          - listitem [ref=f64e208]:
            - strong [ref=f64e209]: Survey depths below are reference data, not calibration.
            - text: They are published apparent AB magnitudes; the render is not tied to them.
