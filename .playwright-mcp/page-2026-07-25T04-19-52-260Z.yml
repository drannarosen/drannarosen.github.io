  - main [ref=f64e32]:
    - generic [ref=f64e33]:
      - paragraph [ref=f64e34]: Prototype · not linked
      - generic [ref=f64e35]:
        - heading "Star-render lab" [level=1] [ref=f64e36]
        - paragraph [ref=f64e37]: "A testbed for the photographic star renderer: apparent flux through a chosen filter, a robust asinh exposure calibrated once against the population, a bounded unresolved core with a Moffat PSF, and a broad faint aureole on the brighter stars. The cluster is sampled analytically — masses from the IMF, positions from a Plummer profile, and each star's temperature and radius derived from its ZAMS state — by the same novascope core the homepage hero uses. The physics lives in pure, dependency-free modules; this page is the Three.js harness around them. Drag to orbit, scroll to zoom. Add ?forceWebGL to exercise the WebGL 2 fallback."
