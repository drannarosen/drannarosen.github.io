      - region [ref=f64e56]:
        - heading "Colour schemes" [level=2] [ref=f64e57]
        - paragraph [ref=f64e58]:
          - text: One physics, several presentations. True colour is faithful and deliberately subtle — stellar blackbody colours trace only a short arc of colour space, so a real cluster reads mostly white with restrained tints. The stretched scheme keeps each star's physical
          - emphasis [ref=f64e59]: hue
          - text: and exaggerates only its saturation. Two earlier schemes (a 5× chroma stretch, and one saturated colour per MK class) were
          - strong [ref=f64e60]: removed
          - text: ": rendered on the real cluster they asserted colour differences far larger than the physics supports, which costs more credibility than the legibility it buys."
