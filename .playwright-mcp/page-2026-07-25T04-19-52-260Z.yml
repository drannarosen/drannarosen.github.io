        - paragraph [ref=f64e269]:
          - text: Rubin's depths here follow the observatory's own Key Numbers page. fluxax carries different values (citing Ivezić et al. 2019 and the LSST Science Book) — up to 0.6 mag apart, with the coadds differing systematically. Both are recorded in
          - code [ref=f64e270]: core/photometry/surveys.ts
          - text: ; neither is treated as wrong. The filter curves themselves are fetched from their primary sources —
