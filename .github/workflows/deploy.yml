name: Deploy to GitHub Pages

on:
  # Deploy on every push to main
  push:
    branches: [main]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# `contents: write` because this now PUBLISHES BY PUSHING A BRANCH rather than by
# uploading an artifact — see the note on the publish step. The old `pages: write`
# and `id-token: write` were for `actions/deploy-pages`, which is no longer used.
permissions:
  contents: write

# Allow one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # fetch-depth 0 so any step that reads git history (e.g. a page's
        # last-changed date) sees more than the single latest commit.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        # Version comes from the packageManager field in package.json.
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # Astro 7 needs >= 22.12; check-sun.mjs uses --experimental-strip-types.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ONE definition of "build". `pnpm build` runs the same prebuild gates
      # (sun geometry, type scale, figure provenance, OG cards) and postbuild
      # gates (search index, internal links, unrendered markup) that run
      # locally — rather than an ad-hoc subset re-listed here that drifts.
      #
      # The old workflow used the withastro action, which runs `astro build`
      # directly and so skipped every npm hook: the search index, the sun
      # check, the link and markup checks never ran on a real deploy. It also
      # ran the figure check first with no node_modules, which broke the moment
      # that check started importing sharp to read image dimensions.
      - name: Build and verify
        run: pnpm build

      # ── PUBLISH BY PUSHING A BRANCH, NOT BY UPLOADING AN ARTIFACT ──
      #
      # This used `actions/upload-pages-artifact` + `actions/deploy-pages`.
      #
      # THE ORIGINAL REASON GIVEN HERE WAS WRONG, and it is corrected rather than
      # deleted because it drove real decisions. This comment claimed GitHub bills
      # Actions storage on BYTES CREATED PER BILLING CYCLE. It does not: storage is
      # billed in GB-HOURS, size x time, so deleting artifacts DOES stop future
      # accrual. And this repository is PUBLIC, so its Actions usage — minutes and
      # storage alike — is discounted to $0. Checked against GitHub's own docs and
      # the billing ledger on 2026-08-08; see docs/deployment.md.
      #
      # So the change is NOT a cost saving, because there was no cost. What a
      # branch deploy still buys is churn: each artifact upload re-sent the whole
      # `dist` — 28 MB, 19 MB of it `data/gravoturb`, which never changes — while
      # git deduplicates by content and transfers those unchanged binaries once.
      #
      # That is a real but modest benefit, and docs/deployment.md states plainly
      # that continuing with it is a choice rather than a settled requirement.
      #
      # `force_orphan` is what keeps that true. Without it the branch would
      # accumulate a commit per deploy and the repository would grow without
      # bound — the usual and fair objection to committing build output. With it
      # the branch is always exactly one commit, and unchanged blobs are shared
      # with the previous one rather than re-sent.
      #
      # `dist/CNAME` comes from `public/CNAME` (anna-rosen.com), so the custom
      # domain rides along in the published tree and does not need re-declaring.
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
